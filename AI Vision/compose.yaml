services:
  artifact-vision:
    build: .
    ports:
      - "8001:8001"
    environment:
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY:-dev-only-change-me}
      AI_DATA_DIR: /data
      MODEL_CACHE_DIR: /models
      MODEL_NUM_THREADS: 2
      MIN_SIMILARITY: 0.72
      MIN_MARGIN: 0.04
      MAX_IMAGE_BYTES: 10485760
    volumes:
      - vision-models:/models
      - vision-data:/data
    restart: unless-stopped

volumes:
  vision-models:
  vision-data:
